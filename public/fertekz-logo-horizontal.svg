<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 100" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Fertekz IT</title>
  <desc id="logo-desc">Fertekz IT:s logotyp med ett blått FC-emblem</desc>
  <defs>
    <linearGradient id="fertekz-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20b8f4"/>
      <stop offset="0.55" stop-color="#1684ee"/>
      <stop offset="1" stop-color="#174fe4"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#fertekz-blue)"/>
  <text x="17" y="68" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="51" font-weight="900" font-style="italic" letter-spacing="-7">FC</text>
  <text x="116" y="68" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="800" font-style="italic" letter-spacing="-2">Fertekz IT</text>
